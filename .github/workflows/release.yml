name: Release module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate module
        run: npm run check

      - name: Build Foundry release assets
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/module.json
          dist/challenge-ribbon.zip
          --title "Challenge Ribbon ${GITHUB_REF_NAME#v}"
          --generate-notes
